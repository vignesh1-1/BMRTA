<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up Form UI | BMRTA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e7ebf0;
            overflow: hidden;
            scrollbar-width: 0.7;
        }

        .bg-circle {
            position: fixed;
            border-radius: 50%;
            background: #e7ebf0;
            box-shadow: 15px 15px 30px rgba(163, 177, 198, .55), -15px -15px 30px rgba(255, 255, 255, .9);
            z-index: -5;
            animation: floating 6s ease-in-out infinite;
        }

        .bg1 { width: 190px; height: 190px; top: 7%; left: 7%; }
        .bg2 { width: 130px; height: 130px; right: 8%; bottom: 8%; animation-delay: 1.5s; }
        .bg3 { width: 55px; height: 55px; right: 20%; top: 22%; animation-delay: 3s; }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }

        .auth-wrapper {
            width: 400px;
            max-width: 92%;
            perspective: 1600px;
        }

        .auth-card {
            position: relative;
            width: 100%;
            min-height: 610px;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(.4, 0, .2, 1);
        }

        .auth-card.flipped {
            transform: rotateY(180deg);
        }

        .form-panel {
            position: absolute;
            inset: 0;
            padding: 40px 38px;
            border-radius: 35px;
            background: #e7ebf0;
            box-shadow: 20px 20px 40px rgba(163, 177, 198, .65), -20px -20px 40px rgba(255, 255, 255, .95);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform-style: preserve-3d;
        }

        .signup-panel {
            transform: rotateY(180deg);
        }

        .auth-card:not(.flipped) .signup-panel { pointer-events: none; }
        .auth-card.flipped .login-panel { pointer-events: none; }
        .auth-card.flipped .signup-panel { pointer-events: auto; }

        .logo {
            width: 86px;
            height: 86px;
            margin: 0 auto 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-size: 30px;
            color: #087cff;
            background: #e7ebf0;
            box-shadow: 9px 9px 18px rgba(163, 177, 198, .65), -9px -9px 18px rgba(255, 255, 255, .95);
            transition: 0.4s ease;
        }

        .logo:hover { transform: translateY(-5px) rotate(8deg); }
        h1 { text-align: center; font-size: 27px; color: #303943; margin-bottom: 7px; }
        .subtitle { text-align: center; color: #7c858e; font-size: 13px; margin-bottom: 30px; }

        .input-group {
            position: relative;
            width: 100%;
            height: 58px;
            margin-bottom: 19px;
        }

        .electric-border {
            position: absolute;
            inset: -2px;
            border-radius: 19px;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            transition: opacity .2s ease;
        }

        .electric-border::before {
            content: "";
            position: absolute;
            width: 170%;
            height: 170%;
            left: -35%;
            top: -35%;
            background: conic-gradient(from 0deg, transparent 0deg, transparent 30deg, #00eaff 45deg, #00aaff 65deg, #006cff 80deg, transparent 105deg, transparent 360deg);
            animation: electricRotate 1.1s linear infinite;
        }

        .electric-border::after {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: 17px;
            background: #e7ebf0;
        }

        .electric-glow {
            position: absolute;
            inset: -4px;
            border-radius: 21px;
            pointer-events: none;
            opacity: 0;
            filter: blur(7px);
        }

        .input-group:focus-within .electric-border { opacity: 1; }
        .input-group:focus-within .electric-glow {
            opacity: .55;
            animation: electricRotate 1.1s linear infinite;
        }

        @keyframes electricRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .input-group input {
            position: absolute;
            inset: 2px;
            width: calc(100% - 4px);
            height: 54px;
            border: none;
            outline: none;
            border-radius: 16px;
            background: #e7ebf0;
            color: #303943;
            font-size: 15px;
            padding: 0 48px 0 18px;
            z-index: 20;
            box-shadow: inset 6px 6px 12px rgba(163, 177, 198, .55), inset -6px -6px 12px rgba(255, 255, 255, .95);
            transition: box-shadow .25s ease;
        }

        .input-group input:focus {
            box-shadow: inset 3px 3px 7px rgba(163, 177, 198, .55), inset -3px -3px 7px rgba(255, 255, 255, .95);
        }

        .input-group label {
            position: absolute;
            left: 18px;
            top: 20px;
            z-index: 30;
            color: #89929c;
            font-size: 16px;
            pointer-events: none;
            transition: all .25s ease;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -8px;
            left: 13px;
            padding: 2px 8px;
            border-radius: 7px;
            font-size: 10px;
            line-height: 14px;
            white-space: nowrap;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 15px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: #7d8790;
            cursor: pointer;
            z-index: 40;
            font-size: 18px;
        }

        .password-toggle:hover {
            color: #006cff;
            transform: scale(1.1);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 3px 24px;
            color: #7d8790;
            font-size: 14px;
        }

        .checkbox { display: flex; align-items: center; gap: 7px; }
        .checkbox input { accent-color: #0072ff; }
        .options a { color: #006cff; text-decoration: none; }

        .main-btn {
            position: relative;
            isolation: isolate;
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 17px;
            background: #e7ebf0;
            color: #006cff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .4px;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 8px 8px 16px rgba(163, 177, 198, .65), -8px -8px 16px rgba(255, 255, 255, .95);
            transition: .3s ease;
        }

        .main-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, #006cff, #00cfff, #006cff);
            background-size: 200% 100%;
            transform: translateY(100%);
            transition: transform .35s ease;
            z-index: -1;
        }

        .main-btn:hover::before {
            transform: translateY(0);
            animation: buttonMove 1.5s linear infinite;
        }

        @keyframes buttonMove {
            from { background-position: 0 50%; }
            to { background-position: 200% 50%; }
        }

        .main-btn:hover {
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 114, 255, .35);
        }

        .main-btn:active { transform: scale(.97); }

        .switch-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 27px;
            font-size: 12px;
            color: #7d8790;
        }

        .switch-circle {
            width: 49px;
            height: 49px;
            border: none;
            border-radius: 50%;
            background: #e7ebf0;
            color: #0072ff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 7px 7px 14px rgba(163, 177, 198, .65), -7px -7px 14px rgba(255, 255, 255, .95);
            transition: .35s ease;
        }

        .switch-circle:hover {
            color: #fff;
            background: #0072ff;
            transform: rotate(180deg) scale(1.08);
            box-shadow: 0 8px 25px rgba(0, 114, 255, .35);
        }

        .switch-circle:active { transform: scale(.9); }
    </style>
</head>

<body>
    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>

    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">

            <!-- Login Form -->
            <div class="form-panel login-panel">
                <div class="logo">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1>Welcome</h1>
                <p class="subtitle">Login to continue your journey</p>

                <form id="formLogin">
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="email" id="loginEmail" placeholder=" " autocomplete="email" required>
                        <label for="loginEmail">Email Address</label>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="loginPassword" placeholder=" " autocomplete="current-password" required>
                        <label for="loginPassword">Password</label>
                        <button type="button" class="password-toggle" id="toggleLoginBtn">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <div class="options">
                        <label class="checkbox">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#">Forgot Password?</a>
                    </div>
                    <button type="submit" class="main-btn">Login</button>
                </form>

                <div class="switch-area">
                    <span>Don't have an account?</span>
                    <button type="button" class="switch-circle" id="btnGoToSignup">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- Sign Up Form -->
            <div class="form-panel signup-panel">
                <div class="logo">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h1>Create Account</h1>
                <p class="subtitle">Start your journey with us</p>

                <form id="formSignup">
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="signupName" placeholder=" " autocomplete="name" required>
                        <label for="signupName">Full Name</label>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="email" id="signupEmail" placeholder=" " autocomplete="email" required>
                        <label for="signupEmail">Email Address</label>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="signupPassword" placeholder=" " autocomplete="new-password" required>
                        <label for="signupPassword">Password</label>
                        <button type="button" class="password-toggle" id="toggleSignupBtn">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="confirmPassword" placeholder=" " autocomplete="new-password" required>
                        <label for="confirmPassword">Confirm Password</label>
                    </div>

                    <button type="submit" class="main-btn">CREATE ACCOUNT</button>
                </form>

                <div class="switch-area">
                    <span>Already have an account?</span>
                    <button type="button" class="switch-circle" id="btnGoToLogin">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // LIVE RENDER BACKEND API BASE
        const API_BASE = "https://bmrta-backend.onrender.com/api";
        const card = document.getElementById("authCard");

        // 1. Direct Card Flip Handlers
        document.getElementById("btnGoToSignup").addEventListener("click", (e) => {
            e.preventDefault();
            card.classList.add("flipped");
        });

        document.getElementById("btnGoToLogin").addEventListener("click", (e) => {
            e.preventDefault();
            card.classList.remove("flipped");
        });

        // 2. Password Visibility Toggle
        function setupPasswordToggle(buttonId, inputId) {
            const btn = document.getElementById(buttonId);
            const input = document.getElementById(inputId);
            if (!btn || !input) return;

            btn.addEventListener("click", (e) => {
                e.preventDefault();
                const icon = btn.querySelector("i");
                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash");
                } else {
                    input.type = "password";
                    icon.classList.remove("fa-eye-slash");
                    icon.classList.add("fa-eye");
                }
            });
        }
        setupPasswordToggle("toggleLoginBtn", "loginPassword");
        setupPasswordToggle("toggleSignupBtn", "signupPassword");

        // 3. Render Backend Login Submission
        document.getElementById("formLogin").addEventListener("submit", async function (e) {
            e.preventDefault();
            const btn = this.querySelector(".main-btn");
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            btn.disabled = true;
            btn.innerText = "AUTHENTICATING...";

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Invalid login credentials.");

                localStorage.setItem("user_email", email);
                localStorage.setItem("bmrta_token", email);

                btn.innerText = "✓ SUCCESS";
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 500);
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.innerText = "LOGIN";
            }
        });

        // 4. Render Backend Registration Submission
        document.getElementById("formSignup").addEventListener("submit", async function (e) {
            e.preventDefault();
            const btn = this.querySelector(".main-btn");
            const name = document.getElementById("signupName").value.trim();
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value;
            const confirm = document.getElementById("confirmPassword").value;

            if (password !== confirm) {
                alert("Passwords do not match!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "CREATING ACCOUNT...";

            try {
                const res = await fetch(`${API_BASE}/signup`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Registration failed.");

                localStorage.setItem("user_email", email);
                localStorage.setItem("bmrta_token", email);

                btn.innerText = "✓ ACCOUNT CREATED";
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 500);
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.innerText = "CREATE ACCOUNT";
            }
        });
    </script>
</body>

</html>
